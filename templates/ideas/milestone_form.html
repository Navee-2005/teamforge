{% extends "base.html" %}
{% block title %}Milestone{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-1">{% if object %}Edit milestone{% else %}Add milestone{% endif %}</h3>
    <p class="text-muted">Project: {{ idea.title }}</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/_form_fields.html" %}
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-secondary" href="{{ idea.get_absolute_url }}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
