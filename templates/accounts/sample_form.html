{% extends "base.html" %}
{% block title %}Upload sample{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Upload a certificate or project sample</h3>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "partials/_form_fields.html" %}
      <button class="btn btn-primary" type="submit">Upload</button>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:profile_detail' user.profile.pk %}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
