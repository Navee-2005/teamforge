{% extends "base.html" %}
{% block title %}Delete account{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm border-danger"><div class="card-body">
    <h4 class="text-danger">Delete your account?</h4>
    <p>This permanently removes your profile, project ideas, requests and notifications.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Yes, delete my account</button>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:profile_detail' user.profile.pk %}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
