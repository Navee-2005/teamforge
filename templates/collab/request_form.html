{% extends "base.html" %}
{% block title %}Request to join{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-1">Request to join</h3>
    <p class="text-muted">{{ idea.title }} &middot; by {{ idea.owner.username }}</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/_form_fields.html" %}
      <button class="btn btn-primary" type="submit">Send request</button>
      <a class="btn btn-outline-secondary" href="{{ idea.get_absolute_url }}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
